name: PMD Code Quality Check

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    # Always produce the required check, including PRs with no Java changes.

permissions:
  contents: read

concurrency:
  group: pmd-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pmd-scan:
    name: pmd-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PMD_VERSION: '7.10.0'
      PMD_SHA256: cd676b19dbe87e86f7eed5940a484be2d3ab6a2d1d552e605860ab12fbf05cbb
      PMD_REPORT_DIR: backend/target/pmd-diff
      PMD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PMD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout the PR head with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test diff selection and report handling
        id: tests
        run: python -m unittest discover -s scripts/tests -p 'test_pmd*.py' -v

      - name: Record PR context and changed Java files
        id: changed
        run: |
          mkdir -p "$PMD_REPORT_DIR"
          python scripts/pmd_diff.py prepare \
            --base "$PMD_BASE_SHA" --head "$PMD_HEAD_SHA" \
            --output "$PMD_REPORT_DIR" 2>&1 | tee "$PMD_REPORT_DIR/prepare.log"

      - name: Set up JDK 21
        if: steps.changed.outputs.file_count != '0'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and verify the pinned PMD CLI
        if: steps.changed.outputs.file_count != '0'
        run: |
          tool_dir="$RUNNER_TEMP/pmd-tools"
          mkdir -p "$tool_dir"
          {
            curl --fail --silent --show-error --location --retry 3 \
              "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip" \
              --output "$tool_dir/pmd.zip"
            printf '%s  %s\n' "$PMD_SHA256" "$tool_dir/pmd.zip" | sha256sum --check --strict
            unzip -q "$tool_dir/pmd.zip" -d "$tool_dir"
          } > "$PMD_REPORT_DIR/install.log" 2>&1
          printf 'PMD_BIN=%s/pmd-bin-%s/bin/pmd\n' "$tool_dir" "$PMD_VERSION" >> "$GITHUB_ENV"

      - name: Run PMD on the recorded file list
        id: scan
        if: steps.changed.outputs.file_count != '0'
        run: bash scripts/pmd-scan.sh

      - name: Finalize reports and publish the check summary
        if: always()
        env:
          PMD_GITHUB_TOKEN: ${{ github.token }} # Read-only contents permission; never archived.
          PMD_TEST_OUTCOME: ${{ steps.tests.outcome }}
          PMD_PREPARE_OUTCOME: ${{ steps.changed.outcome }}
          PMD_SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python scripts/pmd_diff.py finalize --output "$PMD_REPORT_DIR"

      - name: Upload all PMD evidence even when the check fails
        id: reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pmd-pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: backend/target/pmd-diff/
          retention-days: 90
          if-no-files-found: error

      - name: Link the archived reports
        if: always() && steps.reports.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.reports.outputs.artifact-digest }}
        run: |
          printf '\n[Download all PMD reports](%s) (retention: 90 days).\n\nArchive SHA-256: `%s`\n' \
            "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
