name: Security Test

on:
  pull_request:
      branches:
        - main
        - develop
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      FE_URL: http://localhost:3000
      BE_URL: http://localhost:8080
      MAVEN_ARGS: -DdataDirectory=${{ runner.temp }}/dependency-check-data
      SEMGREP_VERSION: 1.179.0
      GITLEAKS_VERSION: 8.30.1

    steps:
      - name: Checkout complete history for Gitleaks
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [[ -z "$NVD_API_KEY" ]]; then
            echo "::error::Add the NVD_API_KEY repository secret before running the security gate."
            exit 1
          fi

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for Semgrep
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/security.yaml

      - name: Set the NVD cache date
        id: nvd-cache-date
        run: printf 'date=%s\n' "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the Dependency-Check database
        id: nvd-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-${{ runner.os }}-13-${{ steps.nvd-cache-date.outputs.date }}
          restore-keys: |
            dependency-check-${{ runner.os }}-13-

      - name: Update the Dependency-Check database
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash ./mvnw -B -ntp dependency-check:update-only

      - name: Save the updated database before running scans
        if: steps.nvd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: ${{ steps.nvd-cache.outputs.cache-primary-key }}

      - name: Install security scanners
        run: |
          python -m pip install "semgrep==$SEMGREP_VERSION"
          tool_dir="$RUNNER_TEMP/security-tools"
          mkdir -p "$tool_dir/bin"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$tool_dir/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' \
            "$tool_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir/bin" gitleaks
          chmod +x "$tool_dir/bin/gitleaks"
          printf '%s\n' "$tool_dir/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies from the lockfile
        working-directory: frontend
        run: npm ci

      - name: Generate temporary server credentials
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          db_password="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$db_password"
          printf 'JWT_SECRET=%s\nDB_PASSWORD=%s\n' "$jwt_secret" "$db_password" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/security-logs"

      - name: Start Spring Boot on port 8080
        working-directory: backend
        env:
          DB_URL: jdbc:h2:mem:security-ci;DB_CLOSE_DELAY=-1
          DB_USERNAME: sa
          SEED_DATA: 'false'
          ALLOWED_REQUEST_ORIGINS: http://localhost:3000
        run: |
          nohup bash ./mvnw -B -ntp spring-boot:run \
            -Dspring-boot.run.arguments=--server.port=8080 \
            > "$RUNNER_TEMP/security-logs/backend.log" 2>&1 < /dev/null &

      - name: Start Next.js on port 3000
        working-directory: frontend
        env:
          BACKEND_API_URL: http://localhost:8080
          ALLOWED_REQUEST_ORIGINS: http://localhost:3000
        run: |
          nohup npm run dev -- --hostname 127.0.0.1 --port 3000 \
            > "$RUNNER_TEMP/security-logs/frontend.log" 2>&1 < /dev/null &

      - name: Wait for both servers
        run: |
          wait_for_server() {
            local name="$1" url="$2" expected="$3" log_file="$4" status
            for attempt in {1..90}; do
              if status="$(curl --silent --head --connect-timeout 2 --max-time 5 \
                  --output /dev/null --write-out '%{http_code}' "$url")" \
                  && [[ "$status" == "$expected" ]]; then
                return 0
              fi
              sleep 2
            done
            echo "::error::$name did not become ready at $url."
            tail -n 60 "$log_file"
            return 1
          }
          wait_for_server 'Spring Boot' "$BE_URL" 401 "$RUNNER_TEMP/security-logs/backend.log"
          wait_for_server 'Next.js' "$FE_URL" 200 "$RUNNER_TEMP/security-logs/frontend.log"

      - name: Run the full security gate
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -o pipefail
          bash scripts/security-check.sh 2>&1 | tee "$RUNNER_TEMP/security-logs/security-gate.log"

      - name: Upload security reports and server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/security-logs/
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.json
            backend/target/spotbugsXml.xml
            backend/target/surefire-reports/
