title = "PandaStore: default rules with approved historical test-fixture exceptions"

[extend]
useDefault = true

# The historical JWT fixture values were compared in memory with configured
# application secrets and did not match. Current tests now generate random keys.
# History is preserved. Both an exact test path AND the known dummy value must
# match; generic-api-key stays enabled everywhere, including these test paths.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Historical dummy JWT key in test properties only"
condition = "AND"
paths = ['''^backend/src/test/resources/application\.properties$''']
regexTarget = "secret"
regexes = ['''^(?:0123456789abcdef){4}$''']

[[rules.allowlists]]
description = "Historical dummy key prefix in JWT unit test only"
condition = "AND"
paths = ['''^backend/src/test/java/project/project/Service/JwtTokenServiceTest\.java$''']
regexTarget = "secret"
regexes = ['''^0123456789abcdef$''']
