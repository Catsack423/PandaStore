<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1589px;height:722px;background:#FFFFFF;" width="1589px" height="722px" viewBox="0 0 1589 722" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="559.651" y="29.698" fill="#0F172A" font-size="21" textLength="463.292" font-weight="700" font-family="Arial">SellerApplication State: Actual Review Guards</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="4"><ellipse cx="1036.74" cy="61.148" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><rect x="999.74" y="165.148" width="73.786" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="1004.74" y="190.23" fill="#000" font-size="14" textLength="63.786" font-family="Arial">PENDING</text><rect x="377.74" y="332.648" width="87.8" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="382.74" y="357.73" fill="#000" font-size="14" textLength="77.8" font-family="Arial">APPROVED</text><rect x="635.74" y="668.148" width="83.896" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="640.74" y="693.23" fill="#000" font-size="14" textLength="73.896" font-family="Arial">REJECTED</text><rect x="865.74" y="525.148" width="137.579" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="870.74" y="550.23" fill="#000" font-size="14" textLength="127.579" font-family="Arial">NEED_MORE_DOC</text><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="18"><path d="M501.24,303.148 L501.24,348.648 L465.92,352.648 L501.24,356.648 L501.24,401.74 A4,4 0 0 0 505.24,405.74 L961.79,405.74 A4,4 0 0 0 965.79,401.74 L965.79,309.148 L955.79,299.148 L505.24,299.148 A4,4 0 0 0 501.24,303.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><path d="M955.79,299.148 L955.79,307.148 A2,2 0 0 0 957.79,309.148 L965.79,309.148 L955.79,299.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><text x="507.24" y="317.28" fill="#7C2D12" font-size="14" textLength="443.55" font-family="Arial">Approval saves reviewedBy/reviewedAt, changes User.role to SELLER,</text><text x="507.24" y="333.378" fill="#7C2D12" font-size="14" textLength="322.937" font-family="Arial">and creates ACTIVE Seller plus SellerBankAccount.</text><text x="507.24" y="349.477" fill="#7C2D12" font-size="14" textLength="339.254" font-family="Arial">Already APPROVED or existing seller blocks approval.</text><text x="507.24" y="365.576" fill="#7C2D12" font-size="14" textLength="379.771" font-family="Arial">Later rejection/document request does not remove that Seller</text><text x="507.24" y="381.674" fill="#7C2D12" font-size="14" textLength="140.048" font-family="Arial">or revert the User role.</text><text x="507.24" y="397.773" fill="#7C2D12" font-size="14" textLength="392.984" font-family="Arial">Admin authorization is enforced outside the service by the filter.</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="26"><path d="M422.74,504.148 L422.74,586.641 A4,4 0 0 0 426.74,590.641 L827.187,590.641 A4,4 0 0 0 831.187,586.641 L831.187,549.148 L865.43,545.148 L831.187,541.148 L831.187,510.148 L821.187,500.148 L426.74,500.148 A4,4 0 0 0 422.74,504.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><path d="M821.187,500.148 L821.187,508.148 A2,2 0 0 0 823.187,510.148 L831.187,510.148 L821.187,500.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><text x="428.74" y="518.28" fill="#7C2D12" font-size="14" textLength="256.02" font-family="Arial">No in-place edit/resubmit endpoint exists.</text><text x="428.74" y="534.378" fill="#7C2D12" font-size="14" textLength="387.447" font-family="Arial">After NEED_MORE_DOC or REJECTED, an eligible customer</text><text x="428.74" y="550.477" fill="#7C2D12" font-size="14" textLength="359.468" font-family="Arial">can submit a NEW PENDING application (different entity).</text><text x="428.74" y="566.576" fill="#7C2D12" font-size="14" textLength="354.026" font-family="Arial">All review actions save a review timestamp and reviewer;</text><text x="428.74" y="582.674" fill="#7C2D12" font-size="14" textLength="314.392" font-family="Arial">rejection/document requests also save adminNote.</text></g><!--link *start* to PENDING--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="4" data-link-type="dependency"><path d="M1036.74,71.318 C1036.74,91.158 1036.74,133.418 1036.74,160.048" style="stroke:#475569;stroke-width:1.2;" fill="none" id="*start*-to-PENDING"/><polygon points="1036.74,165.048,1040.74,156.048,1036.74,160.048,1032.74,156.048,1036.74,165.048" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1111.66" y="115.28" fill="#000" font-size="14" textLength="210.096" font-family="Arial">customer submits new application</text><text x="1037.74" y="131.378" fill="#000" font-size="14" textLength="357.937" font-family="Arial">[not already seller; no PENDING/APPROVED application]</text></g><!--link PENDING to APPROVED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="5" data-link-type="dependency"><path d="M999.48,187.448 C907.35,191.968 663.34,211.928 483.74,299.148 C466.87,307.338 454.347,317.684 442.797,329.094" style="stroke:#475569;stroke-width:1.2;" fill="none" id="PENDING-to-APPROVED"/><polygon points="439.24,332.608,448.454,329.129,442.797,329.094,442.832,323.437,439.24,332.608" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="658.74" y="249.28" fill="#000" font-size="14" textLength="128.406" font-family="Arial">approveApplication()</text><text x="666.916" y="265.378" fill="#000" font-size="14" textLength="112.055" font-family="Arial">[no existing seller]</text></g><!--link PENDING to REJECTED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk7" data-source-line="6" data-link-type="dependency"><path d="M1073.82,203.078 C1189.79,258.198 1530.28,437.758 1398.74,590.148 C1354,641.988 872.601,675.301 724.971,684.371" style="stroke:#475569;stroke-width:1.2;" fill="none" id="PENDING-to-REJECTED"/><polygon points="719.98,684.678,729.208,688.119,724.971,684.371,728.718,680.134,719.98,684.678" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1418.74" y="458.28" fill="#000" font-size="14" textLength="154.854" font-family="Arial">rejectApplication(reason)</text></g><!--link PENDING to NEED_MORE_DOC--><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" id="lnk9" data-source-line="7" data-link-type="dependency"><path d="M1032.86,205.158 C1024.89,243.508 1005.56,332.708 983.74,406.148 C971,449.038 954.422,493.514 944.172,520.044" style="stroke:#475569;stroke-width:1.2;" fill="none" id="PENDING-to-NEED_MORE_DOC"/><polygon points="942.37,524.708,949.345,517.754,944.172,520.044,941.882,514.871,942.37,524.708" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1012.74" y="357.78" fill="#000" font-size="14" textLength="215.53" font-family="Arial">requestMoreDocuments(message)</text></g><!--link REJECTED to APPROVED--><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" id="lnk10" data-source-line="8" data-link-type="dependency"><path d="M635.43,683.438 C541.3,674.218 319.39,646.818 274.74,590.148 C215.35,514.768 332.385,417.024 389.785,375.604" style="stroke:#475569;stroke-width:1.2;" fill="none" id="REJECTED-to-APPROVED"/><polygon points="393.84,372.678,384.201,374.701,389.785,375.604,388.882,381.188,393.84,372.678" fill="#475569" 