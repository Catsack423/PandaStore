<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1683px;height:474px;background:#FFFFFF;" width="1683px" height="474px" viewBox="0 0 1683 474" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="544.417" y="29.698" fill="#0F172A" font-size="21" textLength="588.051" font-weight="700" font-family="Arial">Shipment State: ShippingStatus Is Independently Managed</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="4"><ellipse cx="1251.5" cy="80.148" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><rect x="785.5" y="203.148" width="73.786" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="790.5" y="228.23" fill="#000" font-size="14" textLength="63.786" font-family="Arial">PENDING</text><rect x="467" y="378.648" width="71.462" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="472" y="403.73" fill="#000" font-size="14" textLength="61.462" font-family="Arial">SHIPPED</text><rect x="428" y="60.148" width="89.358" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="433" y="85.23" fill="#000" font-size="14" textLength="79.358" font-family="Arial">DELIVERED</text><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="17"><path d="M910,341.148 L910,455.838 A4,4 0 0 0 914,459.838 L1305.185,459.838 A4,4 0 0 0 1309.185,455.838 L1309.185,347.148 L1299.185,337.148 L914,337.148 A4,4 0 0 0 910,341.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><path d="M1299.185,337.148 L1299.185,345.148 A2,2 0 0 0 1301.185,347.148 L1309.185,347.148 L1299.185,337.148" style="stroke:#D97706;stroke-width:1;" fill="#FFF7ED"/><text x="916" y="355.28" fill="#7C2D12" font-size="14" textLength="319.006" font-family="Arial">Assign tracking sets courierName, trackingNumber,</text><text x="916" y="371.378" fill="#7C2D12" font-size="14" textLength="321.809" font-family="Arial">Shipment.shippingStatus=SHIPPED and shippedAt;</text><text x="916" y="387.477" fill="#7C2D12" font-size="14" textLength="312.423" font-family="Arial">it also sets Order=SHIPPED and Order.shippedAt.</text><text x="916" y="403.576" fill="#7C2D12" font-size="14" textLength="343.991" font-family="Arial">Admin updates accept any valid ShippingStatus without</text><text x="916" y="419.674" fill="#7C2D12" font-size="14" textLength="331.516" font-family="Arial">checking the previous state or changing Order status.</text><text x="916" y="435.773" fill="#7C2D12" font-size="14" textLength="257.564" font-family="Arial">SHIPPED adds shippedAt only if missing.</text><text x="916" y="451.872" fill="#7C2D12" font-size="14" textLength="378.185" font-family="Arial">Changing to PENDING/SHIPPED does not clear deliveredAt.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="26"><path d="M6,55.148 L6,105.444 A4,4 0 0 0 10,109.444 L388.716,109.444 A4,4 0 0 0 392.716,105.444 L392.716,84.148 L427.81,80.148 L392.716,76.148 L392.716,61.148 L382.716,51.148 L10,51.148 A4,4 0 0 0 6,55.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><path d="M382.716,51.148 L382.716,59.148 A2,2 0 0 0 384.716,61.148 L392.716,61.148 L382.716,51.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><text x="12" y="69.28" fill="#7C2D12" font-size="14" textLength="339.268" font-family="Arial">Customer confirmation and auto-confirm change Order</text><text x="12" y="85.378" fill="#7C2D12" font-size="14" textLength="341.571" font-family="Arial">to COMPLETED only; Shipment can remain SHIPPED.</text><text x="12" y="101.477" fill="#7C2D12" font-size="14" textLength="365.716" font-family="Arial">No courier callback or automatic tracking integration exists.</text></g><!--link *start* to PENDING--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="4" data-link-type="dependency"><path d="M1242.19,84.508 C1220.65,92.478 1166.07,113.738 1124.5,139.148 C1103.71,151.858 1103.67,163.038 1081.5,173.148 C1007.6,206.868 916.65,217.062 864.77,220.342" style="stroke:#475569;stroke-width:1.2;" fill="none" id="*start*-to-PENDING"/><polygon points="859.78,220.658,869.014,224.082,864.77,220.342,868.51,216.098,859.78,220.658" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1152.242" y="153.28" fill="#000" font-size="14" textLength="169.839" font-family="Arial">entity default / @PrePersist</text><text x="1125.5" y="169.378" fill="#000" font-size="14" textLength="223.323" font-family="Arial">[not normally saved by tracking API]</text></g><!--link *start* to SHIPPED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk5" data-source-line="5" data-link-type="dependency"><path d="M1261.07,83.208 C1282.28,88.338 1333.01,103.928 1353.5,139.148 C1361.1,152.208 1361.5,160.328 1353.5,173.148 C1281.73,288.148 1208.8,266.408 1079.5,307.148 C1072.94,309.218 667.861,372.043 543.081,391.363" style="stroke:#475569;stroke-width:1.2;" fill="none" id="*start*-to-SHIPPED"/><polygon points="538.14,392.128,547.646,394.704,543.081,391.363,546.422,386.798,538.14,392.128" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1368.31" y="220.28" fill="#000" font-size="14" textLength="263.765" font-family="Arial">assignTrackingNumber() creates shipment</text><text x="1332.5" y="236.378" fill="#000" font-size="14" textLength="335.385" font-family="Arial">[owned PREPARING order; paid group; valid tracking]</text></g><!--link PENDING to SHIPPED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk6" data-source-line="6" data-link-type="dependency"><path d="M785.07,23