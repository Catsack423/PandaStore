<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1837px;height:593px;background:#FFFFFF;" width="1837px" height="593px" viewBox="0 0 1837 593" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="749.587" y="29.698" fill="#0F172A" font-size="21" textLength="331.396" font-weight="700" font-family="Arial">Product State and Stock Updates</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="4"><ellipse cx="885" cy="61.148" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><rect x="854.5" y="198.648" width="60.565" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="859.5" y="223.73" fill="#000" font-size="14" textLength="50.565" font-family="Arial">ACTIVE</text><rect x="467.5" y="391.148" width="122.793" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="472.5" y="416.23" fill="#000" font-size="14" textLength="112.793" font-family="Arial">OUT_OF_STOCK</text><rect x="867.5" y="536.148" width="74.565" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="872.5" y="561.23" fill="#000" font-size="14" textLength="64.565" font-family="Arial">INACTIVE</text><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="16"><path d="M1319.5,169.148 L1319.5,214.648 L915.82,218.648 L1319.5,222.648 L1319.5,267.74 A4,4 0 0 0 1323.5,271.74 L1818.57,271.74 A4,4 0 0 0 1822.57,267.74 L1822.57,175.148 L1812.57,165.148 L1323.5,165.148 A4,4 0 0 0 1319.5,169.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><path d="M1812.57,165.148 L1812.57,173.148 A2,2 0 0 0 1814.57,175.148 L1822.57,175.148 L1812.57,165.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><text x="1325.5" y="183.28" fill="#7C2D12" font-size="14" textLength="373.905" font-family="Arial">createProduct allows stock=0 but defaults status to ACTIVE.</text><text x="1325.5" y="199.378" fill="#7C2D12" font-size="14" textLength="411.633" font-family="Arial">Checkout InventoryService.reserve requires ACTIVE product/shop</text><text x="1325.5" y="215.477" fill="#7C2D12" font-size="14" textLength="393.729" font-family="Arial">and sufficient stock, but does not set OUT_OF_STOCK at zero.</text><text x="1325.5" y="231.576" fill="#7C2D12" font-size="14" textLength="482.07" font-family="Arial">Catalog availability also requires stock > 0, active shop and active seller User.</text><text x="1325.5" y="247.674" fill="#7C2D12" font-size="14" textLength="399.198" font-family="Arial">An explicit updateProduct status overrides automatic stock logic;</text><text x="1325.5" y="263.773" fill="#7C2D12" font-size="14" textLength="348.653" font-family="Arial">any enum value is accepted, including the current value.</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="24"><path d="M6,370.148 L6,452.641 A4,4 0 0 0 10,456.641 L427.646,456.641 A4,4 0 0 0 431.646,452.641 L431.646,415.148 L467.32,411.148 L431.646,407.148 L431.646,376.148 L421.646,366.148 L10,366.148 A4,4 0 0 0 6,370.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><path d="M421.646,366.148 L421.646,374.148 A2,2 0 0 0 423.646,376.148 L431.646,376.148 L421.646,366.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><text x="12" y="384.28" fill="#7C2D12" font-size="14" textLength="369.564" font-family="Arial">ProductService restoreStock reactivates OUT_OF_STOCK.</text><text x="12" y="400.378" fill="#7C2D12" font-size="14" textLength="375.067" font-family="Arial">InventoryService release and SubOrderService restoreStock</text><text x="12" y="416.477" fill="#7C2D12" font-size="14" textLength="342.392" font-family="Arial">only increase stock, without reactivating product status.</text><text x="12" y="432.576" fill="#7C2D12" font-size="14" textLength="404.646" font-family="Arial">INACTIVE stock changes do not automatically activate a product.</text><text x="12" y="448.674" fill="#7C2D12" font-size="14" textLength="329.964" font-family="Arial">These paths are intentionally shown as implemented.</text></g><!--link *start* to ACTIVE--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="4" data-link-type="dependency"><path d="M885,71.408 C885,96.258 885,159.778 885,193.458" style="stroke:#475569;stroke-width:1.2;" fill="none" id="*start*-to-ACTIVE"/><polygon points="885,198.458,889,189.458,885,193.458,881,189.458,885,198.458" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="896.131" y="115.28" fill="#000" font-size="14" textLength="143.165" font-family="Arial">normal createProduct()</text><text x="886" y="131.378" fill="#000" font-size="14" textLength="163.427" font-family="Arial">[stock >= 0; default status]</text></g><!--link ACTIVE to OUT_OF_STOCK--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="5" data-link-type="dependency"><path d="M854.43,219.428 C750.99,219.398 416.87,225.328 351,302.148 C341.16,313.618 342.01,323.998 351,336.148 C378.09,372.768 407.04,348.408 449,366.148 C465.64,373.188 479,380.178 493.5,388.548" style="stroke:#475569;stroke-width:1.2;" fill="none" id="ACTIVE-to-OUT_OF_STOCK"/><polygon points="497.83,391.048,492.035,383.084,493.5,388.548,488.036,390.013,497.83,391.048" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="352" y="316.28" fill="#000" font-size="14" textLength="327.578" font-family="Arial">updateProduct(stock=0 or status=OUT_OF_STOCK)</text><text x="382.136" y="332.378" fill="#000" font-size="14" textLength="267.306" font-family="Arial">or validateAndDeductStock() [remaining=0]</text></g><!--link OUT_OF_STOCK to ACTIVE--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk6" data-source-line="6" data-link-type="dependency"><path d="M578.6,391.148 C610.12,377.958 651.05,358.748 684,336.148 C702.15,323.698 701.96,314.758 720,302.148 C763.57,271.678 815.394,247.959 849.694,233.689" style="stroke:#475569;stroke-width:1.2;" fill="none" id="OUT_OF_STOCK-to-ACTIVE"/><polygon points="854.31,231.768,844.464,231.532,849.694,233.689,847.537,238.918,854.31,231.768" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="734.022" y="316.28" fill="#000" font-size="14" textLength="273.13" font-family="Arial">updateProduct(stock > 0 or status=ACTIVE)</text><text x="721" y="332.378" fill="#000" font-size="14" textLength="299.175" font-family="Arial">or ProductService.restoreStock() [newStock > 0]</text></g><!--link ACTIVE to INACTIVE--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk8" data-source-line="7" data-link-type="dependency"><path d="M915.52,227.798 C949.17,238.598 1001.63,261.238 1025,302.148 C1069.54,380.098 1074.54,429.268 1025,504.148 C1006.83,531.618 975.444,543.312 947.504,549.172" style="stroke:#475569;stroke-width:1.2;" fill="none" id="ACTIVE-to-INACTIVE"/><polygon points="942.61,550.198,952.239,552.265,947.504,549.172,950.597,544.436,942.61,550.198" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1061" y="416.28" fill="#000" font-size="14" textLength="210.485" font-family="Arial">updateProduct(status=INACTIVE)</text></g><!--link INACTIVE to ACTIVE--><g class="link" data-entity-1="ent0007" data-entity-2="ent0002" id="lnk10" data-source-line="9" data-link-type="dependency"><path d="M942.8,550.948 C1029.53,540.438 1238.55,509.958 1280,456.148 C1304.41,424.458 1302.84,398.988 1280,366.148 C1194.37,243.068 997.586,223.366 920.586,220.316" style="stroke:#475569;stroke-width:1.2;" fill="none" id="INACTIVE-to-ACTIVE"/><polygon points="915.59,220.118,924.425,224.471,920.586,220.316,924.741,216.477,915.59,220.118" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1298" y="416.28" fill="#000" font-size="14" textLength="196.485" font-family="Arial">updateProduct(status=ACTIVE)</text></g><!--link OUT_OF_STOCK to INACTIVE--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk9" data-source-line="8" data-link-type="dependency"><path d="M516.25,431.458 C504.48,451.928 491.3,484.018 509,504.148 C532.49,530.858 767.879,547.224 862.259,552.784" style="stroke:#475569;stroke-width:1.2;" fill="none" id="OUT_OF_STOCK-to-INACTIVE"/><polygon points="867.25,553.078,858.501,548.556,862.259,552.784,858.03,556.542,867.25,553.078" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="510" y="500.28" fill="#000" font-size="14" textLength="210.485" font-family="Arial">updateProduct(status=INACTIVE)</text></g><!--link INACTIVE to OUT_OF_STOCK--><g class="link" data-entity-1="ent0007" data-entity-2="ent0004" id="lnk11" data-source-line="10" data-link-type="dependency"><path d="M867.22,543.188 C837.89,533.558 796.39,519.198 761,504.148 C744.54,497.148 741.39,493.318 725,486.148 C678.18,465.668 628.419,447.059 588.809,432.919" style="stroke:#475569;stroke-width:1.2;" fill="none" id="INACTIVE-to-OUT_OF_STOCK"/><polygon points="584.1,431.238,591.231,438.031,588.809,432.919,593.921,430.497,584.1,431.238" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="762" y="500.28" fill="#000" font-size="14" textLength="258.713" font-family="Arial">updateProduct(status=OUT_OF_STOCK)</text></g><!--link ACTIVE to ACTIVE--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk12" data-source-line="11" data-link-type="dependency"><path d="M915.66,200.998 C933.66,197.238 950.5,203.118 950.5,218.648 C950.5,234.178 938.554,241.08 920.554,237.32" style="stroke:#475569;stroke-width:1.2;" fill="none" id="ACTIVE-to-ACTIVE"/><polygon points="915.66,236.298,923.652,242.054,920.554,237.32,925.288,234.223,915.66,236.298" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1019.141" y="215.78" fill="#000" font-size="14" textLength="213.972" font-family="Arial">InventoryService.reserve/release()</text><text x="956.5" y="231.878" fill="#000" font-size="14" textLength="339.254" font-family="Arial">or SubOrderService.restoreStock() / change stock only</text></g><!--link OUT_OF_STOCK to OUT_OF_STOCK--><g class="link" data-entity-1="ent0004" data-entity-2="ent0004" id="lnk13" data-source-line="12" data-link-type="dependency"><path d="M590.72,395.408 C610.16,395.648 625.5,400.898 625.5,411.148 C625.5,421.398 615.16,426.586 595.72,426.826" style="stroke:#475569;stroke-width:1.2;" fill="none" id="OUT_OF_STOCK-to-OUT_OF_STOCK"/><polygon points="590.72,426.888,599.769,430.777,595.72,426.826,599.67,422.777,590.72,426.888" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="719.427" y="408.28" fill="#000" font-size="14" textLength="163.399" font-family="Arial">InventoryService.release()</text><text x="631.5" y="424.378" fill="#000" font-size="14" textLength="339.254" font-family="Arial">or SubOrderService.restoreStock() / change stock only</text></g><!--link INACTIVE to INACTIVE--><g class="link" data-entity-1="ent0007" data-entity-2="ent0007" id="lnk14" data-source-line="13" data-link-type="dependency"><path d="M942.67,545.198 C961.13,543.768 977.5,547.418 977.5,556.148 C977.5,564.878 966.115,568.914 947.655,567.484" style="stroke:#475569;stroke-width:1.2;" fill="none" id="INACTIVE-to-INACTIVE"/><polygon points="942.67,567.098,951.334,571.781,947.655,567.484,951.952,563.805,942.67,567.098" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterl