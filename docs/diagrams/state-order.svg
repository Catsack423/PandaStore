<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1693px;height:1056px;background:#FFFFFF;" width="1693px" height="1056px" viewBox="0 0 1693 1056" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="648.315" y="29.698" fill="#0F172A" font-size="21" textLength="389.802" font-weight="700" font-family="Arial">Order State: Seller Sub-Order Lifecycle</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="4"><ellipse cx="81.5" cy="61.148" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><rect x="7" y="149.148" width="149.248" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="12" y="174.23" fill="#000" font-size="14" textLength="139.248" font-family="Arial">PENDING_PAYMENT</text><rect x="544.5" y="284.148" width="204.476" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="549.5" y="309.23" fill="#000" font-size="14" textLength="194.476" font-family="Arial">WAITING_SELLER_CONFIRM</text><rect x="600.5" y="435.148" width="92.462" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="605.5" y="460.23" fill="#000" font-size="14" textLength="82.462" font-family="Arial">PREPARING</text><rect x="765" y="585.148" width="71.462" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="770" y="610.23" fill="#000" font-size="14" textLength="61.462" font-family="Arial">SHIPPED</text><rect x="985" y="744.148" width="97.124" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="990" y="769.23" fill="#000" font-size="14" textLength="87.124" font-family="Arial">COMPLETED</text><rect x="571.5" y="952.648" width="94.027" height="40" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="4" ry="4"/><text x="576.5" y="977.73" fill="#000" font-size="14" textLength="84.027" font-family="Arial">CANCELLED</text><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="18"><path d="M935,907.148 L935,968.648 L665.68,972.648 L935,976.648 L935,1037.937 A4,4 0 0 0 939,1041.937 L1354.309,1041.937 A4,4 0 0 0 1358.309,1037.937 L1358.309,913.148 L1348.309,903.148 L939,903.148 A4,4 0 0 0 935,907.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><path d="M1348.309,903.148 L1348.309,911.148 A2,2 0 0 0 1350.309,913.148 L1358.309,913.148 L1348.309,903.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><text x="941" y="921.28" fill="#7C2D12" font-size="14" textLength="337.675" font-family="Arial">Customer cancellation accepts PENDING_PAYMENT,</text><text x="941" y="937.378" fill="#7C2D12" font-size="14" textLength="311.965" font-family="Arial">WAITING_SELLER_CONFIRM and PREPARING.</text><text x="941" y="953.477" fill="#7C2D12" font-size="14" textLength="319.806" font-family="Arial">Seller rejection/customer cancellation restore stock;</text><text x="941" y="969.576" fill="#7C2D12" font-size="14" textLength="341.646" font-family="Arial">paid orders also invoke partial refund for the shop total.</text><text x="941" y="985.674" fill="#7C2D12" font-size="14" textLength="299.571" font-family="Arial">Orchestration failure releases all reserved stock.</text><text x="941" y="1001.773" fill="#7C2D12" font-size="14" textLength="402.309" font-family="Arial">Admin refund methods can cancel orders without restoring stock:</text><text x="941" y="1017.872" fill="#7C2D12" font-size="14" textLength="296.495" font-family="Arial">partial refund has no source-order-status guard;</text><text x="941" y="1033.97" fill="#7C2D12" font-size="14" textLength="337.695" font-family="Arial">full refund cancels every non-COMPLETED sub-order.</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="28"><path d="M105.5,271.148 L105.5,337.542 A4,4 0 0 0 109.5,341.542 L505.319,341.542 A4,4 0 0 0 509.319,337.542 L509.319,308.148 L544.49,304.148 L509.319,300.148 L509.319,277.148 L499.319,267.148 L109.5,267.148 A4,4 0 0 0 105.5,271.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><path d="M499.319,267.148 L499.319,275.148 A2,2 0 0 0 501.319,277.148 L509.319,277.148 L499.319,267.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><text x="111.5" y="285.28" fill="#7C2D12" font-size="14" textLength="382.819" font-family="Arial">PaymentService callback updates null, PENDING_PAYMENT</text><text x="111.5" y="301.378" fill="#7C2D12" font-size="14" textLength="339.206" font-family="Arial">or existing WAITING_SELLER_CONFIRM orders only.</text><text x="111.5" y="317.477" fill="#7C2D12" font-size="14" textLength="350.896" font-family="Arial">It does not resurrect CANCELLED/COMPLETED orders.</text><text x="111.5" y="333.576" fill="#7C2D12" font-size="14" textLength="350.991" font-family="Arial">Its failure path leaves order states and stock unchanged.</text></g><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="34"><path d="M1301,723.148 L1301,760.148 L1082.04,764.148 L1301,768.148 L1301,805.641 A4,4 0 0 0 1305,809.641 L1674.433,809.641 A4,4 0 0 0 1678.433,805.641 L1678.433,729.148 L1668.433,719.148 L1305,719.148 A4,4 0 0 0 1301,723.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><path d="M1668.433,719.148 L1668.433,727.148 A2,2 0 0 0 1670.433,729.148 L1678.433,729.148 L1668.433,719.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFF7ED"/><text x="1307" y="737.28" fill="#7C2D12" font-size="14" textLength="338.522" font-family="Arial">Receipt sets completedAt, without changing Shipment.</text><text x="1307" y="753.378" fill="#7C2D12" font-size="14" textLength="281.654" font-family="Arial">Auto-confirm runs hourly for SHIPPED orders</text><text x="1307" y="769.477" fill="#7C2D12" font-size="14" textLength="284.047" font-family="Arial">whose shippedAt is before now minus 7 days.</text><text x="1307" y="785.576" fill="#7C2D12" font-size="14" textLength="354.095" font-family="Arial">The 24h unconfirmed-order scheduler queries shippedAt,</text><text x="1307" y="801.674" fill="#7C2D12" font-size="14" textLength="356.433" font-family="Arial">not createdAt; ordinary waiting orders have no shippedAt.</text></g><!--link *start* to PENDING_PAYMENT--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="4" data-link-type="dependency"><path d="M81.5,71.188 C81.5,88.308 81.5,120.818 81.5,143.838" style="stroke:#475569;stroke-width:1.2;" fill="none" id="*start*-to-PENDING_PAYMENT"/><polygon points="81.5,148.838,85.5,139.838,81.5,143.838,77.5,139.838,81.5,148.838" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="82.5" y="115.28" fill="#000" font-size="14" textLength="164.924" font-family="Arial">OrderDraftFactory.create()</text></g><!--link PENDING_PAYMENT to WAITING_SELLER_CONFIRM--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="5" data-link-type="dependency"><path d="M156.11,184.488 C245.03,202.008 397.88,233.498 527.5,267.148 C546.93,272.188 563.168,276.859 582.048,282.619" style="stroke:#475569;stroke-width:1.2;" fill="none" id="PENDING_PAYMENT-to-WAITING_SELLER_CONFIRM"/><polygon points="586.83,284.078,579.389,277.626,582.048,282.619,577.054,285.278,586.83,284.078" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="393.5" y="233.28" fill="#000" font-size="14" textLength="122.944" font-family="Arial">successful payment</text></g><!--link WAITING_SELLER_CONFIRM to PREPARING--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk7" data-source-line="6" data-link-type="dependency"><path d="M646.5,324.318 C646.5,352.928 646.5,401.478 646.5,430.048" style="stroke:#475569;stroke-width:1.2;" fill="none" id="WAITING_SELLER_CONFIRM-to-PREPARING"/><polygon points="646.5,435.048,650.5,426.048,646.5,430.048,642.5,426.048,646.5,435.048" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="774.334" y="385.28" fill="#000" font-size="14" textLength="121.365" font-family="Arial">sellerAcceptOrder()</text><text x="647.5" y="401.378" fill="#000" font-size="14" textLength="375.033" font-family="Arial">[owning active seller; group PAID/PARTIALLY_REFUNDED]</text></g><!--link PREPARING to SHIPPED--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" id="lnk9" data-source-line="7" data-link-type="dependency"><path d="M666.32,475.198 C695.73,503.458 747.025,552.753 776.665,581.243" style="stroke:#475569;stroke-width:1.2;" fill="none" id="PREPARING-to-SHIPPED"/><polygon points="780.27,584.708,776.553,575.587,776.665,581.243,771.009,581.355,780.27,584.708" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="819.665" y="527.28" fill="#000" font-size="14" textLength="153.269" font-family="Arial">assignTrackingNumber()</text><text x="746.5" y="543.378" fill="#000" font-size="14" textLength="299.599" font-family="Arial">[owning seller; paid group; valid courier/tracking]</text></g><!--link SHIPPED to COMPLETED--><g class="link" data-entity-1="ent0008" data-entity-2="ent0010" id="lnk11" data-source-line="8" data-link-type="dependency"><path d="M829.07,625.398 C873.91,655.618 956.153,711.034 1000.913,741.194" style="stroke:#475569;stroke-width:1.2;" fill="none" id="SHIPPED-to-COMPLETED"/><polygon points="1005.06,743.988,999.831,735.642,1000.913,741.194,995.361,742.276,1005.06,743.988" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="927.248" y="669.28" fill="#000" font-size="14" textLength="261.406" font-family="Arial">confirmOrderDelivered() [customer owner]</text><text x="917.5" y="685.378" fill="#000" font-size="14" textLength="280.902" font-family="Arial">or autoConfirmDelivered() [scheduler eligible]</text></g><!--link COMPLETED to COMPLETED--><g class="link" data-entity-1="ent0010" data-entity-2="ent0010" id="lnk12" data-source-line="9" data-link-type="dependency"><path d="M1082.39,746.968 C1101.29,746.198 1117,751.928 1117,764.148 C1117,776.368 1106.286,782.301 1087.386,781.531" style="stroke:#475569;stroke-width:1.2;" fill="none" id="COMPLETED-to-COMPLETED"/><polygon points="1082.39,781.328,1091.22,785.691,1087.386,781.531,1091.545,777.698,1082.39,781.328" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1125.352" y="761.28" fill="#000" font-size="14" textLength="150.145" font-family="Arial">confirmOrderDelivered()</text><text x="1123" y="777.378" fill="#000" font-size="14" textLength="154.848" font-family="Arial">[customer owner] / no-op</text></g><!--link PENDING_PAYMENT to CANCELLED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0013" id="lnk14" data-source-line="10" data-link-type="dependency"><path d="M74.63,189.248 C66.05,214.828 52.5,261.788 52.5,303.148 C52.5,303.148 52.5,303.148 52.5,765.148 C52.5,875.238 430.238,943.138 566.278,964.068" style="stroke:#475569;stroke-width:1.2;" fill="none" id="PENDING_PAYMENT-to-CANCELLED"/><polygon points="571.22,964.828,562.933,959.506,566.278,964.068,561.716,967.413,571.22,964.828" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="78.807" y="519.28" fill="#000" font-size="14" textLength="146.262" font-family="Arial">customerCancelOrder()</text><text x="73.331" y="535.378" fill="#000" font-size="14" textLength="157.213" font-family="Arial">[owner; nonblank reason]</text><text x="53.5" y="551.477" fill="#000" font-size="14" textLength="196.875" font-family="Arial">or orchestration payment failure</text></g><!--link WAITING_SELLER_CONFIRM to CANCELLED--><g class="link" data-entity-1="ent0004" data-entity-2="ent0013" id="lnk15" data-source-line="11" data-link-type="dependency"><path d="M587.58,324.218 C489.05,356.978 301.5,423.358 301.5,454.148 C301.5,454.148 301.5,454.148 301.5,765.148 C301.5,892.408 478.183,944.308 566.483,962.518" style="stroke:#475569;stroke-width:1.2;" fill="none" id="WAITING_SELLER_CONFIRM-to-CANCELLED"/><polygon points="571.38,963.528,563.373,957.793,566.483,962.518,561.758,965.628,571.38,963.528" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="330.507" y="602.28" fill="#000" font-size="14" textLength="206.972" font-family="Arial">sellerRejectOrder() [paid; reason]</text><text x="302.5" y="618.378" fill="#000" font-size="14" textLength="262.985" font-family="Arial">or customerCancelOrder() [owner; reason]</text></g><!--link PREPARING to CANCELLED--><g class="link" data-entity-1="ent0006" data-entity-2="ent0013" id="lnk16" data-source-line="12" data-link-type="dependency"><path d="M642,475.208 C633.94,510.478 617.33,588.398 611.5,655.148 C601.7,767.388 611.635,897.849 616.155,947.359" style="stroke:#475569;stroke-width:1.2;" fill="none" id="PREPARING-to-CANCELLED"/><polygon points="616.61,952.338,619.775,943.012,616.155,947.359,611.808,943.739,616.61,952.338" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="617.976" y="669.28" fill="#000" font-size="14" textLength="146.262" font-family="Arial">customerCancelOrder()</text><text x="612.5" y="685.378" fill="#000" font-size="14" textLength="157.213" font-family="Arial">[owner; nonblank reason]</text></g><!--link SHIPPED to CANCELLED--><g class="link" data-entity-1="ent0008" data-entity-2="ent0013" id="lnk17" data-source-line="13" data-link-type="dependency"><path d="M796.86,625.388 C793.29,642.508 787.11,668.028 778.5,689.148 C735.83,793.798 664.649,903.665 634.579,948.185" style="stroke:#475569;stroke-width:1.2;" fill="none" id="SHIPPED-to-CANCELLED"/><polygon points="631.78,952.328,640.132,947.109,634.579,948.185,633.503,942.631,631.78,952.328" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="765.5" y="761.28" fill="#000" font-size="14" textLength="147.075" font-family="Arial">Admin partial/full refund</text><text x="773.272" y="777.378" fill="#000" font-size="14" textLength="131.53" font-family="Arial">[refundable payment]</text></g><!--link COMPLETED to CANCELLED--><g class="link" data-entity-1="ent0010" data-entity-2="ent0013" id="lnk18" data-source-line="14" data-link-type="dependency"><path d="M1001.61,784.278 C988.12,792.198 972.17,801.328 957.5,809.148 C852.81,864.938 730.458,921.362 665.648,950.592" style="stroke:#475569;stroke-width:1.2;" fill="none" id="COMPLETED-to-CANCELLED"/><polygon points="661.09,952.648,670.939,952.594,665.648,950.592,667.65,945.301,661.09,952.648" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="897.621" y="853.28" fill="#000" font-size="14" textLength="125.289" font-family="Arial">Admin partial refund</text><text x="894.5" y="869.378" fill="#000" font-size="14" textLength="131.53" font-family="Arial">[refundable payment]</text></g><!--link CANCELLED to CANCELLED--><g class="link" data-entity-1="ent0013" data-entity-2="ent0013" id="lnk19" data-source-line="15" data-link-type="dependency"><path d="M654.75,952.618 C678.06,947.398 700.5,954.068 700.5,972.648 C700.5,991.228 682.939,998.991 659.629,993.771" style="stroke:#475569;stroke-width:1.2;" fill="none" id="CANCELLED-to-CANCELLED"/><polygon points="654.75,992.678,662.658,998.548,659.629,993.771,664.407,990.741,654.75,992.678" fill="#475569" style="stroke:#475569;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="735.713" y="969.78" fill="#000" font-size="14" textLength="146.262" font-family="Arial">customerCancelOrder()</te